<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activites</title>
    <link rel="stylesheet" href="Activites.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
</head>
<body>
    <section>
        <div class="icon">
            <span><i class="fa-solid fa-calendar"></i></span>
            <h2>Registration & Booking</h2>
                

        </div>
            <p>fill in the datiles below to register or book your place</p>
            <div class="form">
                <div class="right">
                    <h2>personal information</h2>
                    <form>
                        <label for="name">full name</label>
                        <input type="text" required placeholder="Enter your name" id="name">

                        <label for="email">email</label>
                        <input type="email" required placeholder="enter your email" id="email">
                        <label for="phone">phone number</label>
                        <input type="tel" required placeholder="enter your phone">
                        <button>submit</button>


                    </form>


                  

                </div>



                <div class="left">
                    <h2>Booking Datiles</h2>
                    <form>
                        <label for="course">courses/Activites</label>
                        <select id="course">
                            <option value="" selected disabled>select courses or activity</option>
                            <option value="">front end</option>
                            <option value="">backend</option>
                            <option value="">mobile applection</option>
                            <option value="">other</option>
                        </select>
                        <label for="date">Date</label>
                        <input type="date" id="Date">
                        <label for="massge">massege</label>
                        <textarea placeholder="Type your massge" id="massege">
                           
                        </textarea>
                    </form>


                </div>






            </div>



    </section>
    
</body>
</html>
